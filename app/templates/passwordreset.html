<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | VYBE Store</title>

    <link rel="stylesheet" href="{% static 'css/passwordreset.css' %}">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>

<div class="background">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div class="container">
    <div class="left">
        <h1>Reset Password</h1>

        <p>
            Create a strong password to secure your account.
            Your password should be unique and difficult to guess.
        </p>

        <img src="https://cdn-icons-png.flaticon.com/512/6195/6195700.png" alt="">

    </div>

    <div class="right">
        <form action="{% url 'passwordreset' %}" method="POST">
            {% csrf_token %}
            <h2>Create New Password</h2>
            {% if error %}
            <div class="error">
                {{error}}
            </div>
            {% endif %}

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                name="new_password"
                placeholder="New Password"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>
            </div>

            <button>
                Update Password
            </button>

        </form>

    </div>

</div>

</body>
</html>
